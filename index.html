<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valdishopper | Project Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --vs-pink: #D64294;
            --vs-navy: #0B1C49;
            --vs-pink-subtle: #FBF0F7;
            --vs-pink-dark: #A02D6E;
            --vs-navy-subtle: #EEF1F8;
            --vs-success: #1B8A5A;
            --vs-font-title: 'League Spartan', sans-serif;
            --vs-font-body: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            font-family: var(--vs-font-body);
            background-color: #F0F2F8;
            color: var(--vs-navy);
            margin: 0;
        }
        h1, h2, h3, .font-title { font-family: var(--vs-font-title); }

        /* Header */
        header {
            background: var(--vs-navy);
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(11,28,73,0.3);
        }
        .logo { font-family: var(--vs-font-title); font-size: 1.5rem; font-weight: 800; color: white; letter-spacing: -0.5px; }
        .logo span { color: var(--vs-pink); }
        .header-sub { color: #8A94B8; font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

        /* Stats bar */
        .stats-bar {
            background: white;
            border-bottom: 1px solid #E4E8F3;
            padding: 0.875rem 2rem;
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .stat-item { display: flex; align-items: center; gap: 0.5rem; }
        .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
        .stat-label { font-size: 0.7rem; font-weight: 600; color: #8A94B8; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-val { font-size: 0.85rem; font-weight: 700; color: var(--vs-navy); font-family: var(--vs-font-title); }

        /* Main layout */
        main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

        .section-title {
            font-family: var(--vs-font-title);
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--vs-navy);
            margin-bottom: 0.25rem;
        }
        .section-sub { font-size: 0.8rem; color: #8A94B8; font-weight: 500; margin-bottom: 1.75rem; }

        /* Cards grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 16px;
            border: 1px solid #E4E8F3;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(11,28,73,0.06);
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .card:hover { box-shadow: 0 8px 24px rgba(11,28,73,0.12); transform: translateY(-2px); }

        .card-header {
            padding: 1.25rem 1.25rem 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
        }
        .card-title-row { flex: 1; }
        .card-nombre {
            font-family: var(--vs-font-title);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--vs-navy);
            margin: 0 0 0.2rem;
            line-height: 1.2;
        }

        /* Estado badge */
        .badge {
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .badge-encurso    { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }
        .badge-desarrollo { background: #FFF7ED; color: #C2410C; border: 1px solid #FED7AA; }
        .badge-planificacion { background: #F5F3FF; color: #6D28D9; border: 1px solid #DDD6FE; }
        .badge-finalizado { background: #F0FDF4; color: #15803D; border: 1px solid #BBF7D0; }
        .badge-pruebas    { background: #FFF0F7; color: #A02D6E; border: 1px solid #F9A8D4; }

        /* Short desc */
        .card-desc-short {
            font-size: 0.72rem;
            color: #6B7698;
            font-weight: 500;
            margin: 0;
            line-height: 1.5;
        }

        /* Expandable body */
        .card-body { padding: 1rem 1.25rem; flex: 1; display: flex; flex-direction: column; gap: 1rem; }

        /* Description detail */
        .desc-detail {
            background: var(--vs-navy-subtle);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            font-size: 0.72rem;
            color: #4A5578;
            line-height: 1.7;
            border-left: 3px solid var(--vs-pink);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
            opacity: 0;
        }
        .desc-detail.open { max-height: 300px; opacity: 1; }

        .expand-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--vs-pink);
            font-family: var(--vs-font-body);
            letter-spacing: 0.3px;
            padding: 0;
            margin-top: -0.25rem;
            text-transform: uppercase;
        }
        .expand-btn svg { transition: transform 0.3s; }
        .expand-btn.open svg { transform: rotate(180deg); }

        /* Progress */
        .progress-section {}
        .progress-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }
        .progress-label { font-size: 0.65rem; font-weight: 700; color: var(--vs-navy); text-transform: uppercase; letter-spacing: 0.5px; }
        .progress-pct { font-size: 0.65rem; font-weight: 800; color: var(--vs-pink); font-family: var(--vs-font-title); }
        .progress-track {
            background: #E4E8F3;
            border-radius: 99px;
            height: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--vs-pink), #E87AC0);
            transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
        }
        .progress-fill.complete { background: linear-gradient(90deg, var(--vs-success), #2DB870); }

        /* Tasks */
        .tasks-list { display: flex; flex-direction: column; gap: 0.3rem; }
        .task-item {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.45rem 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .task-item:hover { background: #F5F6FA; }

        .task-check {
            width: 16px; height: 16px;
            border-radius: 4px;
            border: 2px solid #C4CAE0;
            background: white;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            cursor: pointer;
        }
        .task-check.checked {
            background: var(--vs-success);
            border-color: var(--vs-success);
        }
        .task-check svg { display: none; }
        .task-check.checked svg { display: block; }

        .task-label {
            font-size: 0.72rem;
            color: #4A5578;
            font-weight: 500;
            line-height: 1.4;
            transition: all 0.2s;
            flex: 1;
        }
        .task-label.done { text-decoration: line-through; color: #A8B0C8; }

        /* Card footer */
        .card-footer {
            padding: 0.75rem 1.25rem;
            border-top: 1px solid #F0F2F8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tasks-count { font-size: 0.65rem; font-weight: 600; color: #A8B0C8; }
        .conn-badge {
            font-size: 0.6rem;
            font-weight: 700;
            color: #6B7698;
            background: #F0F2F8;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            letter-spacing: 0.3px;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--vs-navy);
            color: white;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border-left: 3px solid var(--vs-success);
            box-shadow: 0 8px 24px rgba(11,28,73,0.25);
            display: none;
            align-items: center;
            gap: 0.5rem;
            z-index: 200;
        }

        @media (max-width: 640px) {
            .stats-bar { gap: 1rem; flex-wrap: wrap; padding: 0.75rem 1rem; }
            main { padding: 1.25rem 1rem 4rem; }
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">VALDI<span>SHOPPER</span></div>
    <div class="header-sub" style="display:none" id="header-sub">Dashboard Mejora Continua</div>
    <div class="header-sub" id="header-sub-vis">Dashboard Mejora Continua</div>
</header>

<div class="stats-bar" id="stats-bar"></div>

<main>
    <div class="section-title">Seguimiento de Proyectos</div>
    <div class="section-sub">Mejora Continua · Los Ríos Region</div>
    <div class="cards-grid" id="dashboard"></div>
</main>

<div id="toast">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path stroke="#1B8A5A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    <span id="toast-msg">Tarea actualizada</span>
</div>

<script>
const proyectos = [
    {
        id: 'sigmc',
        nombre: 'SIGMC',
        desc_short: 'Consolidación de información operacional y conexión Power BI.',
        desc_long: `Sistema de consolidación de información logística. Actualmente integra datos de <strong>Beetrack</strong> (rutas) y <strong>PFA</strong>. En desarrollo activo el módulo de <strong>Falabella</strong>, que junto al Scraper-Geosort alimentará una base de datos central conectada a <strong>Power BI</strong> para análisis operacional en tiempo real.`,
        estado: 'En Curso',
        conexion: 'Power BI · BigQuery',
        tareas: [
            { t: 'Integración Beetrack', done: true },
            { t: 'Integración PFA', done: true },
            { t: 'Módulo Falabella', done: false },
            { t: 'Conexión Base de Datos Power BI', done: false }
        ]
    },
    {
        id: 'scraper',
        nombre: 'Scraper-Geosort',
        desc_short: 'Descarga semanal automatizada de información Falabella.',
        desc_long: `Automatización encargada de descargar semanalmente la información de <strong>Falabella</strong> mediante web scraping. Alimenta directamente al módulo Falabella de SIGMC. Los datos extraídos son validados antes de su carga, garantizando la integridad del flujo hacia Power BI.`,
        estado: 'Desarrollo',
        conexion: 'SIGMC · GCP',
        tareas: [
            { t: 'Scripts de descarga semanal', done: true },
            { t: 'Validación de datos extraídos', done: false }
        ]
    },
    {
        id: 'consolidacion',
        nombre: 'Consolidación Scripts',
        desc_short: 'Plataforma de carga de scripts con análisis IA y detección de automatizaciones.',
        desc_long: `Plataforma para que los distintos departamentos (<strong>MC, CCO, Finanzas, Personas</strong>) puedan subir sus scripts y proyectos. A través de <strong>IA generativa</strong> se genera un archivo <code>.md</code> que explica cómo funciona cada proyecto. Además, analiza los procesos descritos para <strong>identificar tareas rutinarias automatizables</strong> y oportunidades de mejora futura.`,
        estado: 'Planificación',
        conexion: 'IA · Multi-depto',
        tareas: [
            { t: 'Interfaz de carga de archivos', done: false },
            { t: 'Integración IA para generación de MD', done: false },
            { t: 'Mapeo de tareas rutinarias automatizables', done: false }
        ]
    },
    {
        id: 'ccohub',
        nombre: 'CCO-Hub',
        desc_short: 'Plataforma centralizada de gestión CCO. Completamente desplegada.',
        desc_long: `Plataforma centralizada para el equipo CCO. <strong>Proyecto finalizado</strong> y en producción. Incluye el despliegue completo y pruebas de usuario aprobadas. Actualmente se espera la aprobación de la aplicación móvil complementaria <strong>CATEX-Móvil</strong> para cerrar el ecosistema completo.`,
        estado: 'Finalizado',
        conexion: 'Cloud Run · GCP',
        tareas: [
            { t: 'Despliegue plataforma web', done: true },
            { t: 'Pruebas de usuario', done: true }
        ]
    },
    {
        id: 'catex',
        nombre: 'CATEX-Móvil',
        desc_short: 'App móvil en prueba cerrada, pendiente de aprobación final.',
        desc_long: `Aplicación móvil complementaria a CCO-Hub. Ya completó su desarrollo y se encuentra en <strong>fase de prueba cerrada</strong> con conductores. El único paso pendiente es la <strong>aprobación de las personas faltantes</strong> para poder publicar la versión definitiva y cerrar el ciclo del ecosistema CCO.`,
        estado: 'Pruebas',
        conexion: 'Android · Play Store',
        tareas: [
            { t: 'Desarrollo módulo móvil', done: true },
            { t: 'Prueba cerrada con conductores', done: true },
            { t: 'Aprobación personas faltantes', done: false }
        ]
    }
];

const estadoBadge = {
    'En Curso':      'badge-encurso',
    'Desarrollo':    'badge-desarrollo',
    'Planificación': 'badge-planificacion',
    'Finalizado':    'badge-finalizado',
    'Pruebas':       'badge-pruebas',
};

function checkSVG() {
    return `<svg width="10" height="10" fill="none" viewBox="0 0 24 24"><path stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
}

function chevronSVG() {
    return `<svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>`;
}

function renderStats() {
    const bar = document.getElementById('stats-bar');
    const counts = { 'Finalizado': 0, 'En Curso': 0, 'Desarrollo': 0, 'Pruebas': 0, 'Planificación': 0 };
    proyectos.forEach(p => counts[p.estado] = (counts[p.estado] || 0) + 1);
    const totalTareas = proyectos.reduce((a, p) => a + p.tareas.length, 0);
    const doneTareas  = proyectos.reduce((a, p) => a + p.tareas.filter(t => t.done).length, 0);

    const colors = {
        'Finalizado': '#15803D', 'En Curso': '#1D4ED8',
        'Desarrollo': '#C2410C', 'Pruebas': '#A02D6E', 'Planificación': '#6D28D9'
    };

    let html = `<div class="stat-item"><span class="stat-label">Proyectos</span><span class="stat-val">${proyectos.length}</span></div>`;
    html += `<div style="width:1px;background:#E4E8F3;height:28px;"></div>`;
    Object.entries(counts).filter(([,v]) => v > 0).forEach(([k, v]) => {
        html += `<div class="stat-item"><span class="stat-dot" style="background:${colors[k]}"></span><span class="stat-label">${k}</span><span class="stat-val">${v}</span></div>`;
    });
    html += `<div style="width:1px;background:#E4E8F3;height:28px;margin-left:auto;"></div>`;
    html += `<div class="stat-item"><span class="stat-label">Tareas completadas</span><span class="stat-val">${doneTareas}/${totalTareas}</span></div>`;
    bar.innerHTML = html;
}

function renderDashboard() {
    const container = document.getElementById('dashboard');
    container.innerHTML = proyectos.map(p => {
        const total     = p.tareas.length;
        const completed = p.tareas.filter(t => t.done).length;
        const percent   = total ? Math.round((completed / total) * 100) : 0;
        const isComplete = percent === 100;

        return `
        <div class="card" id="card-${p.id}">
            <div class="card-header">
                <div class="card-title-row">
                    <h2 class="card-nombre">${p.nombre}</h2>
                    <p class="card-desc-short">${p.desc_short}</p>
                </div>
                <span class="badge ${estadoBadge[p.estado] || 'badge-encurso'}">${p.estado}</span>
            </div>

            <div class="card-body">
                <!-- Expand button -->
                <button class="expand-btn" id="btn-${p.id}" onclick="toggleDesc('${p.id}')">
                    ${chevronSVG()} Ver descripción
                </button>

                <!-- Expandable description -->
                <div class="desc-detail" id="desc-${p.id}">
                    ${p.desc_long}
                </div>

                <!-- Progress -->
                <div class="progress-section">
                    <div class="progress-meta">
                        <span class="progress-label">Progreso</span>
                        <span class="progress-pct">${percent}%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill ${isComplete ? 'complete' : ''}" id="fill-${p.id}" style="width: ${percent}%"></div>
                    </div>
                </div>

                <!-- Tasks -->
                <div class="tasks-list">
                    ${p.tareas.map((t, i) => `
                        <div class="task-item" onclick="updateTask('${p.id}', ${i})">
                            <div class="task-check ${t.done ? 'checked' : ''}" id="chk-${p.id}-${i}">
                                ${checkSVG()}
                            </div>
                            <span class="task-label ${t.done ? 'done' : ''}" id="lbl-${p.id}-${i}">${t.t}</span>
                        </div>
                    `).join('')}
                </div>
            </div>

            <div class="card-footer">
                <span class="tasks-count">${completed} de ${total} tareas completadas</span>
                ${p.conexion ? `<span class="conn-badge">${p.conexion}</span>` : ''}
            </div>
        </div>`;
    }).join('');

    // Trigger progress bar animation
    setTimeout(() => {
        proyectos.forEach(p => {
            const total     = p.tareas.length;
            const completed = p.tareas.filter(t => t.done).length;
            const percent   = total ? Math.round((completed / total) * 100) : 0;
            const fill = document.getElementById(`fill-${p.id}`);
            if (fill) fill.style.width = percent + '%';
        });
    }, 50);
}

function toggleDesc(id) {
    const desc = document.getElementById(`desc-${id}`);
    const btn  = document.getElementById(`btn-${id}`);
    const isOpen = desc.classList.toggle('open');
    btn.classList.toggle('open', isOpen);
    btn.innerHTML = `${chevronSVG()} ${isOpen ? 'Ocultar descripción' : 'Ver descripción'}`;
}

function updateTask(projId, taskIdx) {
    const proj = proyectos.find(p => p.id === projId);
    proj.tareas[taskIdx].done = !proj.tareas[taskIdx].done;

    // Update just this task without full re-render
    const chk = document.getElementById(`chk-${projId}-${taskIdx}`);
    const lbl = document.getElementById(`lbl-${projId}-${taskIdx}`);
    const isDone = proj.tareas[taskIdx].done;
    chk.classList.toggle('checked', isDone);
    lbl.classList.toggle('done', isDone);

    // Update progress
    const total     = proj.tareas.length;
    const completed = proj.tareas.filter(t => t.done).length;
    const percent   = total ? Math.round((completed / total) * 100) : 0;
    const fill = document.getElementById(`fill-${projId}`);
    const pct  = document.querySelector(`#card-${projId} .progress-pct`);
    const foot = document.querySelector(`#card-${projId} .tasks-count`);
    if (fill) { fill.style.width = percent + '%'; fill.classList.toggle('complete', percent === 100); }
    if (pct)  pct.textContent = percent + '%';
    if (foot) foot.textContent = `${completed} de ${total} tareas completadas`;

    renderStats();
    showToast(isDone ? '✓ Tarea completada' : 'Tarea desmarcada');
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    const msgEl = document.getElementById('toast-msg');
    msgEl.textContent = msg;
    toast.style.display = 'flex';
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => toast.style.display = 'none', 2500);
}

renderDashboard();
renderStats();
</script>
</body>
</html>
