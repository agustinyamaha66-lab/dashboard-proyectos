<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valdishopper | Project Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --vs-pink: #D64294; --vs-navy: #0B1C49;
            --vs-pink-subtle: #FBF0F7; --vs-pink-dark: #A02D6E;
            --vs-navy-subtle: #EEF1F8; --vs-success: #1B8A5A;
            --vs-font-title: 'League Spartan', sans-serif;
            --vs-font-body: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--vs-font-body); background: #F0F2F8; color: var(--vs-navy); }
        h1,h2,h3,.font-title { font-family: var(--vs-font-title); }

        header {
            background: var(--vs-navy); padding: 0 2rem; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 20px rgba(11,28,73,.3);
        }
        .logo { font-family: var(--vs-font-title); font-size: 1.5rem; font-weight: 800; color: white; letter-spacing: -.5px; }
        .logo span { color: var(--vs-pink); }
        .header-sub { color: #8A94B8; font-size: .72rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

        .nav-tabs {
            background: white; border-bottom: 1px solid #E4E8F3;
            display: flex; align-items: center; padding: 0 2rem;
        }
        .tab-btn {
            padding: .85rem 1.25rem; font-size: .72rem; font-weight: 700;
            letter-spacing: .5px; text-transform: uppercase; border: none;
            background: none; cursor: pointer; color: #8A94B8;
            border-bottom: 2px solid transparent; transition: all .2s;
            display: flex; align-items: center; gap: .4rem;
        }
        .tab-btn:hover { color: var(--vs-navy); }
        .tab-btn.active { color: var(--vs-pink); border-bottom-color: var(--vs-pink); }
        .tab-badge {
            background: #F0F2F8; color: #6B7698; font-size: .6rem;
            font-weight: 700; padding: .1rem .4rem; border-radius: 99px;
        }
        .tab-btn.active .tab-badge { background: var(--vs-pink-subtle); color: var(--vs-pink-dark); }

        .stats-bar {
            background: white; border-bottom: 1px solid #E4E8F3;
            padding: .75rem 2rem; display: flex; gap: 1.5rem;
            align-items: center; flex-wrap: wrap;
        }
        .stat-item { display: flex; align-items: center; gap: .4rem; }
        .stat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .stat-label { font-size: .65rem; font-weight: 600; color: #8A94B8; text-transform: uppercase; letter-spacing: .5px; }
        .stat-val { font-size: .82rem; font-weight: 800; color: var(--vs-navy); font-family: var(--vs-font-title); }
        .stat-divider { width: 1px; background: #E4E8F3; height: 24px; }

        main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
        .section-title { font-family: var(--vs-font-title); font-size: 1.6rem; font-weight: 800; color: var(--vs-navy); margin-bottom: .2rem; }
        .section-sub { font-size: .75rem; color: #8A94B8; font-weight: 500; margin-bottom: 1.75rem; }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px,1fr)); gap: 1.25rem; }

        .card {
            background: white; border-radius: 16px; border: 1px solid #E4E8F3;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 2px 8px rgba(11,28,73,.06);
            transition: box-shadow .2s, transform .2s;
        }
        .card:hover { box-shadow: 0 8px 24px rgba(11,28,73,.12); transform: translateY(-2px); }
        .card-header { padding: 1.25rem 1.25rem 0; display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; }
        .card-title-row { flex: 1; }
        .card-nombre { font-family: var(--vs-font-title); font-size: 1.1rem; font-weight: 800; color: var(--vs-navy); line-height: 1.2; margin-bottom: .2rem; }
        .card-desc-short { font-size: .72rem; color: #6B7698; font-weight: 500; line-height: 1.5; }

        .badge { font-size: .6rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; padding: .25rem .6rem; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
        .badge-encurso       { background:#EFF6FF; color:#1D4ED8; border:1px solid #BFDBFE; }
        .badge-desarrollo    { background:#FFF7ED; color:#C2410C; border:1px solid #FED7AA; }
        .badge-planificacion { background:#F5F3FF; color:#6D28D9; border:1px solid #DDD6FE; }
        .badge-finalizado    { background:#F0FDF4; color:#15803D; border:1px solid #BBF7D0; }
        .badge-pruebas       { background:#FFF0F7; color:#A02D6E; border:1px solid #F9A8D4; }
        .badge-reclutamiento { background:#FEF9C3; color:#854D0E; border:1px solid #FDE68A; }

        .card-body { padding: 1rem 1.25rem; flex: 1; display: flex; flex-direction: column; gap: .9rem; }

        .desc-detail {
            background: var(--vs-navy-subtle); border-radius: 10px;
            padding: .85rem 1rem; font-size: .72rem; color: #4A5578; line-height: 1.7;
            border-left: 3px solid var(--vs-pink);
            max-height: 0; overflow: hidden;
            transition: max-height .4s cubic-bezier(.4,0,.2,1), opacity .3s; opacity: 0;
        }
        .desc-detail.open { max-height: 300px; opacity: 1; }
        .expand-btn {
            background: none; border: none; cursor: pointer;
            display: flex; align-items: center; gap: .35rem;
            font-size: .68rem; font-weight: 700; color: var(--vs-pink);
            font-family: var(--vs-font-body); letter-spacing: .3px;
            padding: 0; text-transform: uppercase;
        }
        .expand-btn svg { transition: transform .3s; }
        .expand-btn.open svg { transform: rotate(180deg); }

        .progress-meta { display: flex; justify-content: space-between; margin-bottom: .4rem; }
        .progress-label { font-size: .65rem; font-weight: 700; color: var(--vs-navy); text-transform: uppercase; letter-spacing: .5px; }
        .progress-pct { font-size: .65rem; font-weight: 800; color: var(--vs-pink); font-family: var(--vs-font-title); }
        .progress-track { background: #E4E8F3; border-radius: 99px; height: 5px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg,var(--vs-pink),#E87AC0); transition: width .6s cubic-bezier(.4,0,.2,1); }
        .progress-fill.complete { background: linear-gradient(90deg,var(--vs-success),#2DB870); }

        .tasks-list { display: flex; flex-direction: column; gap: .3rem; }
        .task-item { display: flex; align-items: center; gap: .65rem; padding: .45rem .6rem; border-radius: 8px; cursor: pointer; transition: background .15s; }
        .task-item:hover { background: #F5F6FA; }
        .task-check { width: 16px; height: 16px; border-radius: 4px; border: 2px solid #C4CAE0; background: white; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .15s; }
        .task-check.checked { background: var(--vs-success); border-color: var(--vs-success); }
        .task-check svg { display: none; }
        .task-check.checked svg { display: block; }
        .task-label { font-size: .72rem; color: #4A5578; font-weight: 500; line-height: 1.4; transition: all .2s; flex: 1; }
        .task-label.done { text-decoration: line-through; color: #A8B0C8; }

        .card-footer { padding: .75rem 1.25rem; border-top: 1px solid #F0F2F8; display: flex; align-items: center; justify-content: space-between; }
        .tasks-count { font-size: .65rem; font-weight: 600; color: #A8B0C8; }
        .conn-badge { font-size: .6rem; font-weight: 700; color: #6B7698; background: #F0F2F8; padding: .2rem .5rem; border-radius: 6px; }

        /* ── Daily ── */
        .daily-grid { display: flex; flex-direction: column; gap: 1rem; }

        .daily-group { background: white; border-radius: 16px; border: 1px solid #E4E8F3; overflow: hidden; box-shadow: 0 2px 8px rgba(11,28,73,.06); }
        .daily-group-header {
            display: flex; align-items: center; gap: .75rem;
            padding: 1rem 1.25rem; cursor: pointer; border-bottom: 1px solid #F0F2F8;
            transition: background .15s;
        }
        .daily-group-header:hover { background: #FAFBFD; }
        .group-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
        .group-info { flex: 1; min-width: 0; }
        .group-name { font-family: var(--vs-font-title); font-size: .95rem; font-weight: 800; color: var(--vs-navy); }
        .group-meta { font-size: .68rem; color: #8A94B8; font-weight: 500; margin-top: .1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .group-right { display: flex; align-items: center; gap: .6rem; flex-shrink: 0; }
        .group-pct { font-size: .75rem; font-weight: 800; font-family: var(--vs-font-title); min-width: 30px; text-align: right; }
        .mini-track { width: 52px; background: #E4E8F3; border-radius: 99px; height: 4px; overflow: hidden; }
        .mini-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg,var(--vs-pink),#E87AC0); transition: width .5s; }
        .group-chevron { transition: transform .3s; color: #8A94B8; }
        .group-chevron.open { transform: rotate(180deg); }

        .daily-tasks-body { padding: .5rem .75rem .75rem; display: none; }
        .daily-tasks-body.open { display: block; }

        .daily-task-row {
            display: flex; align-items: flex-start; gap: .65rem;
            padding: .55rem .5rem; border-radius: 8px; cursor: pointer;
            transition: background .15s;
        }
        .daily-task-row:hover { background: #F5F6FA; }
        .daily-task-content { flex: 1; min-width: 0; }
        .daily-task-name { font-size: .75rem; font-weight: 600; color: #2A3558; line-height: 1.4; }
        .daily-task-name.done { text-decoration: line-through; color: #A8B0C8; }
        .daily-task-note { font-size: .67rem; color: #8A94B8; font-weight: 500; margin-top: .15rem; line-height: 1.5; }

        .freq-tag { font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: .15rem .45rem; border-radius: 5px; white-space: nowrap; flex-shrink: 0; margin-top: .15rem; }
        .freq-diario  { background:#EFF6FF; color:#1D4ED8; }
        .freq-lu-ma   { background:#FFF7ED; color:#C2410C; }
        .freq-adhoc   { background:#F5F3FF; color:#6D28D9; }
        .freq-semanal { background:#F0FDF4; color:#15803D; }

        .reset-day-btn {
            margin-top: 1.5rem; padding: .5rem 1rem;
            font-size: .65rem; font-weight: 700; letter-spacing: .5px;
            text-transform: uppercase; border-radius: 8px; cursor: pointer;
            background: #F0F2F8; color: #6B7698; border: none;
            transition: background .15s, color .15s;
        }
        .reset-day-btn:hover { background: var(--vs-pink-subtle); color: var(--vs-pink-dark); }

        #toast {
            position: fixed; bottom: 1.5rem; right: 1.5rem;
            background: var(--vs-navy); color: white; font-size: .72rem; font-weight: 600;
            padding: .75rem 1rem; border-radius: 10px; border-left: 3px solid var(--vs-success);
            box-shadow: 0 8px 24px rgba(11,28,73,.25);
            display: none; align-items: center; gap: .5rem; z-index: 200;
        }

        @media(max-width:640px){
            .nav-tabs { padding: 0 1rem; overflow-x: auto; }
            .tab-btn { padding: .75rem .9rem; font-size: .65rem; }
            main { padding: 1.25rem 1rem 4rem; }
            .cards-grid { grid-template-columns: 1fr; }
            .stats-bar { padding: .75rem 1rem; gap: 1rem; }
            .group-meta { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">VALDI<span>SHOPPER</span></div>
    <div class="header-sub">Mejora Continua</div>
</header>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('proyectos')" id="tab-proyectos">
        📁 Proyectos <span class="tab-badge" id="tbadge-proyectos">6</span>
    </button>
    <button class="tab-btn" onclick="switchTab('diario')" id="tab-diario">
        🗓 Tareas Diarias <span class="tab-badge" id="tbadge-diario">—</span>
    </button>
</div>

<div class="stats-bar" id="stats-bar"></div>

<main>
    <div class="tab-panel active" id="panel-proyectos">
        <div class="section-title">Seguimiento de Proyectos</div>
        <div class="section-sub">Mejora Continua · Agustin Williamson</div>
        <div class="cards-grid" id="dashboard"></div>
    </div>

    <div class="tab-panel" id="panel-diario">
        <div class="section-title">Tareas Diarias</div>
        <div class="section-sub" id="daily-date-sub">Rutina operacional de Mejora Continua</div>
        <div class="daily-grid" id="daily-grid"></div>
        <button class="reset-day-btn" onclick="resetDay()">↺ Resetear día</button>
    </div>
</main>

<div id="toast">
    <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path stroke="#1B8A5A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    <span id="toast-msg">Actualizado</span>
</div>

<script>
/* ── PROYECTOS ── */
const proyectos = [
    {
        id:'sigmc', nombre:'SIGMC', estado:'En Curso', conexion:'Power BI · BigQuery',
        desc_short:'Consolidación de información operacional y conexión Power BI.',
        desc_long:`Sistema de consolidación de información logística. Integra datos de <strong>Beetrack</strong> (rutas) y <strong>PFA</strong>. En desarrollo el módulo de <strong>Falabella</strong>, que junto al Scraper-Geosort alimentará una base de datos central conectada a <strong>Power BI</strong> para análisis operacional en tiempo real.`,
        tareas:[
            {t:'Integración Beetrack', done:true},
            {t:'Integración PFA', done:true},
            {t:'Módulo Falabella', done:true},
            {t:'Conexión Base de Datos Power BI', done:true},
            {t:'Carga de datos automatica beetrak', done:flase}
        ]
    },
    {
        id:'scraper', nombre:'Scraper-Geosort', estado:'Finalizado', conexion:'SIGMC · GCP',
        desc_short:'Descarga semanal automatizada de información Falabella.',
        desc_long:`Automatización encargada de descargar semanalmente la información de <strong>Falabella</strong> mediante web scraping. Alimenta directamente al módulo Falabella de SIGMC. Los datos se validan antes de la carga para garantizar integridad en el flujo hacia Power BI.`,
        tareas:[
            {t:'Scripts de descarga semanal', done:true},
            {t:'Validación de datos extraídos', done:true},
            {t:'Configurar la descarga automatica', done:true},
            {t:'Victor puede conectar con Bigquery a Power bi', done:true}
        ]
    },
    {
        id:'consolidacion', nombre:'Consolidación Scripts', estado:'Planificación', conexion:'IA · Multi-depto',
        desc_short:'Plataforma de carga de scripts con análisis IA y detección de automatizaciones.',
        desc_long:`Plataforma para que los departamentos (<strong>MC, CCO, Finanzas, Personas</strong>) suban sus scripts. La <strong>IA generativa</strong> crea un <code>.md</code> explicando el proyecto y analiza los procesos para <strong>identificar tareas rutinarias automatizables</strong> y oportunidades de mejora futura.`,
        tareas:[
            {t:'Interfaz de carga de archivos', done:true},
            {t:'Integración IA para generación de documento MD', done:true},
            {t:'Mapeo de tareas rutinarias automatizables', done:true},
            {t:'Revisar y hacer nueva interfaz', done:true},
            {t:'hacer pequeñas pruebas para su despliegue', done:true},
            {t:'Hacerla publicar y desplegarla', done:false}
            
        ]
    },
    {
        id:'ccohub', nombre:'CCO-Hub', estado:'Finalizado', conexion:'Cloud Run · GCP',
        desc_short:'Plataforma centralizada de gestión CCO. Completamente desplegada.',
        desc_long:`Plataforma centralizada para el equipo CCO, <strong>finalizada y en producción</strong>. Incluye despliegue completo y pruebas de usuario aprobadas. Se espera la aprobación de la app móvil <strong>CATEX-Móvil</strong> para cerrar el ecosistema completo.`,
        tareas:[
            {t:'Despliegue plataforma web', done:true},
            {t:'Pruebas de usuario', done:true},
            {t:'Revisar ruteador', done:false}
        ]
    },
    {
        id:'catex', nombre:'CATEX-Móvil', estado:'Pruebas', conexion:'Android · Play Store',
        desc_short:'App móvil en prueba cerrada, pendiente aprobación de personas faltantes.',
        desc_long:`App móvil complementaria a CCO-Hub. En <strong>fase de prueba cerrada</strong> con conductores. Pendiente la <strong>aprobación de las personas faltantes</strong> para publicar la versión definitiva y cerrar el ciclo del ecosistema CCO.`,
        tareas:[
            {t:'Desarrollo módulo móvil', done:true},
            {t:'Prueba cerrada con conductores', done:true},
            {t:'Aprobación personas faltantes', done:false},
            {t:'Actualizacion de las pestañas', done:false}
            
        ]
    },
    {
        id:'coordinadores', nombre:'Coordinadores Valdishopper', estado:'Reclutamiento', conexion:'Android · Play Store',
        desc_short:'App de Víctor publicada. En proceso de reclutamiento y elaboración de manual.',
        desc_long:`App móvil de <strong>Víctor</strong> para Coordinadores de Sala. El archivo <strong>AAB fue generado y publicado en Play Store</strong>. Actualmente en proceso de <strong>reclutamiento de usuarios</strong> (obtención de correos) y elaboración del <strong>manual de uso</strong> para cuando se entreguen los accesos correspondientes.`,
        tareas:[
            {t:'Generación y subida AAB a Play Store', done:true},
            {t:'Proceso de reclutamiento de usuarios', done:true},
            {t:'Obtención de correos coordinadores', done:true},
            {t:'Elaboración de manual de uso', done:true},
            {t:'Confirmacion de reclutados y app instalada', done:false},
            {t:'Hacer actualizacion de nuevas funciones o visuales dentro de los 14 dias siguente', done:false}
        ]
    }
];

/* ── TAREAS DIARIAS ── */
const dailyGroups = [
    {
        id:'scrapers', name:'Revisión de Scrapers', icon:'🔍', iconBg:'#EFF6FF',
        meta:'Verificar funcionamiento y descarga correcta de información',
        tasks:[
            { id:'s1', name:'Revisar scrapers de ROTOR (proyecto Guillermo)', note:'Confirmar que estén corriendo y enviando información a los buckets GCP correspondientes.', freq:'diario' },
            { id:'s2', name:'Revisar scrapers autónomos — carga correcta', note:'Verificar que los datos subidos sean completos y sin errores de formato.', freq:'diario' },
            { id:'s3', name:'Comprobar buckets de almacenamiento GCP', note:'Cada scraper debe haber subido correctamente su archivo al bucket asignado.', freq:'diario' },
        ]
    },
    {
        id:'agenda', name:'Agenda y Proyectos', icon:'📋', iconBg:'#F5F3FF',
        meta:'Organización del día y avance en proyectos activos',
        tasks:[
            { id:'a1', name:'Organizar agenda del día con proyectos activos', note:'Priorizar según estado de proyectos y reuniones programadas.', freq:'diario' },
            { id:'a2', name:'Avance en proyectos: comentar y documentar código', note:'Incluye nuevas funcionalidades y mejoras sobre lo existente.', freq:'diario' },
            { id:'a3', name:'Revisión y modificación de scrapers existentes', note:'Ajustes según incidencias detectadas o mejoras planificadas.', freq:'diario' },
        ]
    },
    {
        id:'falabella', name:'Actualización Falabella → Power BI', icon:'📊', iconBg:'#FFF7ED',
        meta:'Carga manual (Víctor de vacaciones) · Solo Lunes o Martes',
        tasks:[
            { id:'f1', name:'Subir archivos Falabella actualizados al Power BI', note:'Carga manual para tener la data lista para la reunión del miércoles.', freq:'lu-ma' },
            { id:'f2', name:'Verificar datos cargados en el reporte', note:'Revisar tablas y visualizaciones antes de la reunión.', freq:'lu-ma' },
        ]
    },
    {
        id:'solicitudes', name:'Solicitudes y Apoyo Ad-hoc', icon:'🤝', iconBg:'#FFF0F7',
        meta:'Peticiones de otros equipos — surgen durante el día',
        tasks:[
            { id:'r1', name:'Atender solicitudes de otros equipos o personas', note:'Priorizar según urgencia. Pueden llegar en cualquier momento del día.', freq:'adhoc' },
            { id:'r2', name:'Registrar brevemente lo atendido', note:'Nota rápida de qué se ayudó y a quién, para trazabilidad.', freq:'adhoc' },
        ]
    }
];

const freqLabel = { 'diario':'Diario','lu-ma':'Lun · Mar','adhoc':'Ad-hoc','semanal':'Semanal' };
const estadoBadge = {
    'En Curso':'badge-encurso','Desarrollo':'badge-desarrollo','Planificación':'badge-planificacion',
    'Finalizado':'badge-finalizado','Pruebas':'badge-pruebas','Reclutamiento':'badge-reclutamiento'
};

/* ── Daily state (sessionStorage) ── */
let dailyState = (()=>{
    const today = new Date().toDateString();
    try { const r = JSON.parse(sessionStorage.getItem('vs_daily')||'{}'); if(r.date===today) return r.tasks; } catch(e){}
    const s={};
    dailyGroups.forEach(g=>g.tasks.forEach(t=>s[t.id]=false));
    return s;
})();
function saveDS(){ try{ sessionStorage.setItem('vs_daily',JSON.stringify({date:new Date().toDateString(),tasks:dailyState})); }catch(e){} }

const checkSVG = `<svg width="10" height="10" fill="none" viewBox="0 0 24 24"><path stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
const chevSVG  = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>`;

/* ── Render proyectos ── */
function renderDashboard(){
    document.getElementById('dashboard').innerHTML = proyectos.map(p=>{
        const total=p.tareas.length, comp=p.tareas.filter(t=>t.done).length, pct=total?Math.round(comp/total*100):0;
        return `
        <div class="card" id="card-${p.id}">
            <div class="card-header">
                <div class="card-title-row">
                    <div class="card-nombre">${p.nombre}</div>
                    <div class="card-desc-short">${p.desc_short}</div>
                </div>
                <span class="badge ${estadoBadge[p.estado]||'badge-encurso'}">${p.estado}</span>
            </div>
            <div class="card-body">
                <button class="expand-btn" id="btn-${p.id}" onclick="toggleDesc('${p.id}')">${chevSVG} Ver descripción</button>
                <div class="desc-detail" id="desc-${p.id}">${p.desc_long}</div>
                <div>
                    <div class="progress-meta">
                        <span class="progress-label">Progreso</span>
                        <span class="progress-pct" id="pct-${p.id}">${pct}%</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill ${pct===100?'complete':''}" id="fill-${p.id}" style="width:${pct}%"></div></div>
                </div>
                <div class="tasks-list">
                    ${p.tareas.map((t,i)=>`
                    <div class="task-item" onclick="updateTask('${p.id}',${i})">
                        <div class="task-check ${t.done?'checked':''}" id="chk-${p.id}-${i}">${checkSVG}</div>
                        <span class="task-label ${t.done?'done':''}" id="lbl-${p.id}-${i}">${t.t}</span>
                    </div>`).join('')}
                </div>
            </div>
            <div class="card-footer">
                <span class="tasks-count" id="foot-${p.id}">${comp} de ${total} tareas</span>
                ${p.conexion?`<span class="conn-badge">${p.conexion}</span>`:''}
            </div>
        </div>`;
    }).join('');
    document.getElementById('tbadge-proyectos').textContent = proyectos.length;
}

function toggleDesc(id){
    const d=document.getElementById(`desc-${id}`), b=document.getElementById(`btn-${id}`);
    const o=d.classList.toggle('open');
    b.classList.toggle('open',o);
    b.innerHTML=`${chevSVG} ${o?'Ocultar descripción':'Ver descripción'}`;
}

function updateTask(projId,idx){
    const p=proyectos.find(x=>x.id===projId);
    p.tareas[idx].done=!p.tareas[idx].done;
    const done=p.tareas[idx].done;
    document.getElementById(`chk-${projId}-${idx}`).classList.toggle('checked',done);
    document.getElementById(`lbl-${projId}-${idx}`).classList.toggle('done',done);
    const total=p.tareas.length, comp=p.tareas.filter(t=>t.done).length, pct=Math.round(comp/total*100);
    const fill=document.getElementById(`fill-${projId}`);
    fill.style.width=pct+'%'; fill.classList.toggle('complete',pct===100);
    document.getElementById(`pct-${projId}`).textContent=pct+'%';
    document.getElementById(`foot-${projId}`).textContent=`${comp} de ${total} tareas`;
    renderStats(); showToast(done?'Tarea completada':'Tarea desmarcada');
}

/* ── Render diario ── */
function renderDaily(){
    const now=new Date();
    const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    document.getElementById('daily-date-sub').textContent=`${dias[now.getDay()]} ${now.getDate()} de ${meses[now.getMonth()]} · Rutina operacional`;

    document.getElementById('daily-grid').innerHTML = dailyGroups.map(g=>{
        const total=g.tasks.length, done=g.tasks.filter(t=>dailyState[t.id]).length, pct=Math.round(done/total*100);
        const pctColor = pct===100?'#15803D':'var(--vs-pink)';
        return `
        <div class="daily-group">
            <div class="daily-group-header" onclick="toggleGroup('${g.id}')">
                <div class="group-icon" style="background:${g.iconBg}">${g.icon}</div>
                <div class="group-info">
                    <div class="group-name">${g.name}</div>
                    <div class="group-meta">${g.meta}</div>
                </div>
                <div class="group-right">
                    <div class="mini-track"><div class="mini-fill" id="mfill-${g.id}" style="width:${pct}%"></div></div>
                    <span class="group-pct" id="gpct-${g.id}" style="color:${pctColor}">${done}/${total}</span>
                    <svg class="group-chevron" id="gchev-${g.id}" width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="#8A94B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
                </div>
            </div>
            <div class="daily-tasks-body" id="gbody-${g.id}">
                ${g.tasks.map(t=>`
                <div class="daily-task-row" onclick="toggleDaily('${t.id}','${g.id}')">
                    <div class="task-check ${dailyState[t.id]?'checked':''}" id="dchk-${t.id}" style="margin-top:2px">${checkSVG}</div>
                    <div class="daily-task-content">
                        <div class="daily-task-name ${dailyState[t.id]?'done':''}" id="dlbl-${t.id}">${t.name}</div>
                        <div class="daily-task-note">${t.note}</div>
                    </div>
                    <span class="freq-tag freq-${t.freq}">${freqLabel[t.freq]}</span>
                </div>`).join('')}
            </div>
        </div>`;
    }).join('');
    updateDailyBadge();
}

function toggleGroup(id){
    document.getElementById(`gbody-${id}`).classList.toggle('open');
    document.getElementById(`gchev-${id}`).classList.toggle('open');
}

function toggleDaily(taskId,groupId){
    dailyState[taskId]=!dailyState[taskId]; saveDS();
    const done=dailyState[taskId];
    document.getElementById(`dchk-${taskId}`).classList.toggle('checked',done);
    document.getElementById(`dlbl-${taskId}`).classList.toggle('done',done);
    const g=dailyGroups.find(x=>x.id===groupId);
    const total=g.tasks.length, doneC=g.tasks.filter(t=>dailyState[t.id]).length, pct=Math.round(doneC/total*100);
    document.getElementById(`mfill-${groupId}`).style.width=pct+'%';
    const gp=document.getElementById(`gpct-${groupId}`);
    gp.textContent=`${doneC}/${total}`; gp.style.color=pct===100?'#15803D':'var(--vs-pink)';
    updateDailyBadge(); renderStats(); showToast(done?'Tarea completada':'Desmarcada');
}

function updateDailyBadge(){
    const all=Object.values(dailyState), done=all.filter(Boolean).length;
    document.getElementById('tbadge-diario').textContent=`${done}/${all.length}`;
}

function resetDay(){
    Object.keys(dailyState).forEach(k=>dailyState[k]=false); saveDS();
    renderDaily(); renderStats(); showToast('Día reseteado');
}

/* ── Stats bar ── */
function renderStats(){
    const bar=document.getElementById('stats-bar');
    const activeTab=document.querySelector('.tab-btn.active').id.replace('tab-','');
    if(activeTab==='proyectos'){
        const counts={};
        proyectos.forEach(p=>counts[p.estado]=(counts[p.estado]||0)+1);
        const totalT=proyectos.reduce((a,p)=>a+p.tareas.length,0);
        const doneT=proyectos.reduce((a,p)=>a+p.tareas.filter(t=>t.done).length,0);
        const colors={'Finalizado':'#15803D','En Curso':'#1D4ED8','Desarrollo':'#C2410C','Pruebas':'#A02D6E','Planificación':'#6D28D9','Reclutamiento':'#854D0E'};
        let h=`<div class="stat-item"><span class="stat-label">Proyectos</span><span class="stat-val">${proyectos.length}</span></div><div class="stat-divider"></div>`;
        Object.entries(counts).filter(([,v])=>v>0).forEach(([k,v])=>{
            h+=`<div class="stat-item"><span class="stat-dot" style="background:${colors[k]||'#888'}"></span><span class="stat-label">${k}</span><span class="stat-val">${v}</span></div>`;
        });
        h+=`<div class="stat-divider" style="margin-left:auto"></div><div class="stat-item"><span class="stat-label">Tareas completadas</span><span class="stat-val">${doneT}/${totalT}</span></div>`;
        bar.innerHTML=h;
    } else {
        const all=Object.values(dailyState), done=all.filter(Boolean).length, pct=Math.round(done/all.length*100);
        const now=new Date();
        let h=`<div class="stat-item"><span class="stat-label">Progreso del día</span><span class="stat-val">${done}/${all.length} tareas</span></div>`;
        h+=`<div class="stat-divider"></div><div class="stat-item"><span class="stat-label">Completado</span><span class="stat-val" style="color:${pct===100?'#15803D':'var(--vs-pink)'}">${pct}%</span></div>`;
        h+=`<div class="stat-divider" style="margin-left:auto"></div><div class="stat-item"><span class="stat-label">Hoy</span><span class="stat-val">${now.toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'})}</span></div>`;
        bar.innerHTML=h;
    }
}

/* ── Tabs ── */
function switchTab(tab){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    document.getElementById(`panel-${tab}`).classList.add('active');
    renderStats();
}

/* ── Toast ── */
function showToast(msg){
    const t=document.getElementById('toast');
    document.getElementById('toast-msg').textContent=msg;
    t.style.display='flex';
    clearTimeout(window._tt);
    window._tt=setTimeout(()=>t.style.display='none',2200);
}

renderDashboard();
renderDaily();
renderStats();
</script>
</body>
</html>
