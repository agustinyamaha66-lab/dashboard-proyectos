<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valdishopper | Panel de Control de Proyectos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --vs-pink: #D64294;
            --vs-navy: #0B1C49;
            --vs-pink-subtle: #FBF0F7;
            --vs-pink-dark: #A02D6E;
            --vs-navy-subtle: #EEF1F8;
            --vs-success: #1B8A5A;
            --vs-warning: #D97706;
            --vs-info: #2563EB;
            --vs-purple: #7C3AED;
            --vs-font-title: 'League Spartan', sans-serif;
            --vs-font-body: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: var(--vs-font-body); 
            background: linear-gradient(135deg, #F0F2F8 0%, #E8EBF5 100%); 
            color: var(--vs-navy); 
            min-height: 100vh;
        }

        h1, h2, h3, .font-title { font-family: var(--vs-font-title); }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(135deg, var(--vs-navy) 0%, #162B5E 100%);
            padding: 0 2.5rem;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 24px rgba(11,28,73,.35);
        }

        .logo { 
            font-family: var(--vs-font-title); 
            font-size: 1.6rem; 
            font-weight: 800; 
            color: white; 
            letter-spacing: -.3px;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .logo::before {
            content: "";
            width: 8px;
            height: 8px;
            background: var(--vs-pink);
            border-radius: 2px;
            transform: rotate(45deg);
        }

        .logo span { color: var(--vs-pink); }

        .header-sub { 
            color: #8A94B8; 
            font-size: .72rem; 
            font-weight: 600; 
            letter-spacing: 1.5px; 
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .header-sub::before {
            content: "";
            width: 4px;
            height: 4px;
            background: var(--vs-success);
            border-radius: 50%;
        }

        /* ===== NAV TABS ===== */
        .nav-tabs {
            background: white;
            border-bottom: 1px solid #E4E8F3;
            display: flex;
            align-items: center;
            padding: 0 2.5rem;
            gap: .25rem;
        }

        .tab-btn {
            padding: 1rem 1.5rem;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .6px;
            text-transform: uppercase;
            border: none;
            background: none;
            cursor: pointer;
            color: #8A94B8;
            border-bottom: 3px solid transparent;
            transition: all .25s ease;
            display: flex;
            align-items: center;
            gap: .5rem;
            position: relative;
        }

        .tab-btn:hover { 
            color: var(--vs-navy);
            background: rgba(11,28,73,.02);
        }

        .tab-btn.active { 
            color: var(--vs-pink); 
            border-bottom-color: var(--vs-pink);
            background: linear-gradient(180deg, transparent 0%, var(--vs-pink-subtle) 100%);
        }

        .tab-badge {
            background: #F0F2F8;
            color: #6B7698;
            font-size: .6rem;
            font-weight: 700;
            padding: .15rem .5rem;
            border-radius: 99px;
            transition: all .25s;
        }

        .tab-btn.active .tab-badge { 
            background: var(--vs-pink); 
            color: white;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            background: white;
            border-bottom: 1px solid #E4E8F3;
            padding: 1rem 2.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .stat-item { 
            display: flex; 
            align-items: center; 
            gap: .5rem; 
        }

        .stat-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .8rem;
        }

        .stat-label { 
            font-size: .65rem; 
            font-weight: 600; 
            color: #8A94B8; 
            text-transform: uppercase; 
            letter-spacing: .5px; 
        }

        .stat-val { 
            font-size: .9rem; 
            font-weight: 800; 
            color: var(--vs-navy); 
            font-family: var(--vs-font-title);
            margin-left: .2rem;
        }

        .stat-divider { 
            width: 1px; 
            background: #E4E8F3; 
            height: 28px; 
        }

        /* ===== MAIN ===== */
        main { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 2.5rem 2rem 4rem; 
        }

        .section-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .section-title { 
            font-family: var(--vs-font-title); 
            font-size: 1.8rem; 
            font-weight: 800; 
            color: var(--vs-navy); 
            margin-bottom: .3rem;
            letter-spacing: -.3px;
        }

        .section-sub { 
            font-size: .8rem; 
            color: #8A94B8; 
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: .4rem;
        }

        .section-sub::before {
            content: "";
            width: 20px;
            height: 2px;
            background: var(--vs-pink);
            border-radius: 2px;
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ===== CARDS GRID ===== */
        .cards-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); 
            gap: 1.5rem; 
        }

        .card {
            background: white;
            border-radius: 20px;
            border: 1px solid #E4E8F3;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 12px rgba(11,28,73,.06);
            transition: all .3s cubic-bezier(.4,0,.2,1);
            position: relative;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--vs-pink), #E87AC0);
            opacity: 0;
            transition: opacity .3s;
        }

        .card:hover { 
            box-shadow: 0 12px 32px rgba(11,28,73,.14); 
            transform: translateY(-4px);
        }

        .card:hover::before {
            opacity: 1;
        }

        /* Card Header */
        .card-header { 
            padding: 1.5rem 1.5rem 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            gap: .75rem; 
        }

        .card-title-row { flex: 1; }

        .card-nombre { 
            font-family: var(--vs-font-title); 
            font-size: 1.15rem; 
            font-weight: 800; 
            color: var(--vs-navy); 
            line-height: 1.2; 
            margin-bottom: .3rem;
        }

        .card-desc-short { 
            font-size: .75rem; 
            color: #6B7698; 
            font-weight: 500; 
            line-height: 1.5;
        }

        /* Badges */
        .badge { 
            font-size: .6rem; 
            font-weight: 800; 
            letter-spacing: .8px; 
            text-transform: uppercase; 
            padding: .3rem .7rem; 
            border-radius: 8px; 
            white-space: nowrap; 
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: .3rem;
        }

        .badge::before {
            content: "";
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }

        .badge-encurso       { background:#EFF6FF; color:#1D4ED8; border:1px solid #BFDBFE; }
        .badge-encurso::before { background:#1D4ED8; }

        .badge-desarrollo    { background:#FFF7ED; color:#C2410C; border:1px solid #FED7AA; }
        .badge-desarrollo::before { background:#C2410C; }

        .badge-planificacion { background:#F5F3FF; color:#6D28D9; border:1px solid #DDD6FE; }
        .badge-planificacion::before { background:#6D28D9; }

        .badge-finalizado    { background:#F0FDF4; color:#15803D; border:1px solid #BBF7D0; }
        .badge-finalizado::before { background:#15803D; }

        .badge-pruebas       { background:#FFF0F7; color:#A02D6E; border:1px solid #F9A8D4; }
        .badge-pruebas::before { background:#A02D6E; }

        .badge-reclutamiento { background:#FEF9C3; color:#854D0E; border:1px solid #FDE68A; }
        .badge-reclutamiento::before { background:#854D0E; }

        /* Card Body */
        .card-body { 
            padding: 1.25rem 1.5rem; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 1.1rem; 
        }

        /* Description */
        .desc-detail {
            background: linear-gradient(135deg, var(--vs-navy-subtle) 0%, #F8F9FC 100%);
            border-radius: 12px;
            padding: 1rem 1.1rem;
            font-size: .75rem;
            color: #4A5578;
            line-height: 1.8;
            border-left: 3px solid var(--vs-pink);
            max-height: 0;
            overflow: hidden;
            transition: max-height .4s cubic-bezier(.4,0,.2,1), opacity .3s, padding .3s;
            opacity: 0;
        }

        .desc-detail.open { 
            max-height: 400px; 
            opacity: 1;
            padding: 1rem 1.1rem;
        }

        .expand-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .4rem;
            font-size: .68rem;
            font-weight: 700;
            color: var(--vs-pink);
            font-family: var(--vs-font-body);
            letter-spacing: .3px;
            padding: .4rem .5rem;
            text-transform: uppercase;
            border-radius: 6px;
            transition: background .2s;
            width: fit-content;
        }

        .expand-btn:hover {
            background: var(--vs-pink-subtle);
        }

        .expand-btn svg { transition: transform .3s; }
        .expand-btn.open svg { transform: rotate(180deg); }

        /* Progress */
        .progress-meta { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: .5rem; 
        }

        .progress-label { 
            font-size: .65rem; 
            font-weight: 700; 
            color: var(--vs-navy); 
            text-transform: uppercase; 
            letter-spacing: .6px;
            display: flex;
            align-items: center;
            gap: .4rem;
        }

        .progress-pct { 
            font-size: .7rem; 
            font-weight: 800; 
            color: var(--vs-pink); 
            font-family: var(--vs-font-title);
        }

        .progress-track { 
            background: #E4E8F3; 
            border-radius: 99px; 
            height: 6px; 
            overflow: hidden;
            position: relative;
        }

        .progress-fill { 
            height: 100%; 
            border-radius: 99px; 
            background: linear-gradient(90deg, var(--vs-pink), #E87AC0); 
            transition: width .6s cubic-bezier(.4,0,.2,1);
            position: relative;
        }

        .progress-fill.complete { 
            background: linear-gradient(90deg, var(--vs-success), #2DB870); 
        }

        .progress-fill::after {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 20px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.4));
            border-radius: 99px;
        }

        /* Tasks */
        .tasks-list { 
            display: flex; 
            flex-direction: column; 
            gap: .35rem; 
        }

        .task-item { 
            display: flex; 
            align-items: center; 
            gap: .7rem; 
            padding: .5rem .7rem; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: all .2s;
            border: 1px solid transparent;
        }

        .task-item:hover { 
            background: #F5F6FA; 
            border-color: #E4E8F3;
        }

        .task-check { 
            width: 18px; 
            height: 18px; 
            border-radius: 5px; 
            border: 2px solid #C4CAE0; 
            background: white; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all .2s;
            cursor: pointer;
        }

        .task-check.checked { 
            background: var(--vs-success); 
            border-color: var(--vs-success);
            box-shadow: 0 2px 6px rgba(27,138,90,.3);
        }

        .task-check svg { display: none; }
        .task-check.checked svg { display: block; }

        .task-label { 
            font-size: .75rem; 
            color: #4A5578; 
            font-weight: 500; 
            line-height: 1.4; 
            transition: all .2s; 
            flex: 1; 
        }

        .task-label.done { 
            text-decoration: line-through; 
            color: #A8B0C8; 
        }

        /* Card Footer */
        .card-footer { 
            padding: .85rem 1.5rem; 
            border-top: 1px solid #F0F2F8; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            background: linear-gradient(180deg, transparent, rgba(240,242,248,.4));
        }

        .tasks-count { 
            font-size: .68rem; 
            font-weight: 600; 
            color: #A8B0C8; 
            display: flex;
            align-items: center;
            gap: .3rem;
        }

        .conn-badge { 
            font-size: .6rem; 
            font-weight: 700; 
            color: #6B7698; 
            background: #F0F2F8; 
            padding: .25rem .6rem; 
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: .3rem;
        }

        .conn-badge::before {
            content: "🔗";
            font-size: .55rem;
        }

        /* ===== DAILY TASKS ===== */
        .daily-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 1.25rem; 
        }

        .daily-group { 
            background: white; 
            border-radius: 20px; 
            border: 1px solid #E4E8F3; 
            overflow: hidden; 
            box-shadow: 0 2px 12px rgba(11,28,73,.06);
            transition: all .3s;
        }

        .daily-group:hover {
            box-shadow: 0 8px 24px rgba(11,28,73,.1);
        }

        .daily-group-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            cursor: pointer;
            border-bottom: 1px solid transparent;
            transition: all .2s;
        }

        .daily-group-header:hover { 
            background: #FAFBFD; 
        }

        .daily-group-header.open {
            border-bottom-color: #F0F2F8;
        }

        .group-icon { 
            width: 40px; 
            height: 40px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.2rem; 
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .group-info { flex: 1; min-width: 0; }

        .group-name { 
            font-family: var(--vs-font-title); 
            font-size: 1rem; 
            font-weight: 800; 
            color: var(--vs-navy); 
        }

        .group-meta { 
            font-size: .7rem; 
            color: #8A94B8; 
            font-weight: 500; 
            margin-top: .15rem;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        .group-right { 
            display: flex; 
            align-items: center; 
            gap: .8rem; 
            flex-shrink: 0; 
        }

        .group-pct { 
            font-size: .8rem; 
            font-weight: 800; 
            font-family: var(--vs-font-title); 
            min-width: 36px; 
            text-align: right; 
        }

        .mini-track { 
            width: 60px; 
            background: #E4E8F3; 
            border-radius: 99px; 
            height: 5px; 
            overflow: hidden; 
        }

        .mini-fill { 
            height: 100%; 
            border-radius: 99px; 
            background: linear-gradient(90deg, var(--vs-pink), #E87AC0); 
            transition: width .5s; 
        }

        .group-chevron { 
            transition: transform .3s; 
            color: #8A94B8; 
        }

        .group-chevron.open { 
            transform: rotate(180deg); 
        }

        .daily-tasks-body { 
            padding: .75rem 1rem 1rem; 
            display: none; 
        }

        .daily-tasks-body.open { 
            display: block; 
        }

        .daily-task-row {
            display: flex;
            align-items: flex-start;
            gap: .75rem;
            padding: .65rem .6rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all .2s;
            border: 1px solid transparent;
        }

        .daily-task-row:hover { 
            background: #F5F6FA; 
            border-color: #E4E8F3;
        }

        .daily-task-content { flex: 1; min-width: 0; }

        .daily-task-name { 
            font-size: .78rem; 
            font-weight: 600; 
            color: #2A3558; 
            line-height: 1.4; 
            transition: all .2s;
        }

        .daily-task-name.done { 
            text-decoration: line-through; 
            color: #A8B0C8; 
        }

        .daily-task-note { 
            font-size: .68rem; 
            color: #8A94B8; 
            font-weight: 500; 
            margin-top: .2rem; 
            line-height: 1.5; 
        }

        .freq-tag { 
            font-size: .58rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: .4px; 
            padding: .2rem .5rem; 
            border-radius: 6px; 
            white-space: nowrap; 
            flex-shrink: 0; 
            margin-top: .15rem; 
        }

        .freq-diario  { background:#EFF6FF; color:#1D4ED8; }
        .freq-lu-ma   { background:#FFF7ED; color:#C2410C; }
        .freq-adhoc   { background:#F5F3FF; color:#6D28D9; }
        .freq-semanal { background:#F0FDF4; color:#15803D; }

        .reset-day-btn {
            margin-top: 2rem;
            padding: .65rem 1.25rem;
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .6px;
            text-transform: uppercase;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            color: #6B7698;
            border: 1px solid #E4E8F3;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: .4rem;
            box-shadow: 0 2px 8px rgba(11,28,73,.06);
        }

        .reset-day-btn:hover { 
            background: var(--vs-pink-subtle); 
            color: var(--vs-pink-dark);
            border-color: var(--vs-pink);
            box-shadow: 0 4px 12px rgba(214,66,148,.15);
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--vs-navy);
            color: white;
            font-size: .75rem;
            font-weight: 600;
            padding: .9rem 1.25rem;
            border-radius: 12px;
            border-left: 3px solid var(--vs-success);
            box-shadow: 0 12px 32px rgba(11,28,73,.3);
            display: none;
            align-items: center;
            gap: .6rem;
            z-index: 200;
            animation: slideIn .3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width: 768px){
            header { padding: 0 1rem; height: 60px; }
            .logo { font-size: 1.3rem; }
            .nav-tabs { padding: 0 1rem; overflow-x: auto; }
            .tab-btn { padding: .75rem 1rem; font-size: .65rem; }
            main { padding: 1.5rem 1rem 4rem; }
            .cards-grid { grid-template-columns: 1fr; }
            .stats-bar { padding: .75rem 1rem; gap: 1rem; }
            .section-title { font-size: 1.4rem; }
            .group-meta { display: none; }
            .section-header { flex-direction: column; align-items: flex-start; }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { animation: fadeInUp .4s ease forwards; }
        .card:nth-child(1) { animation-delay: 0s; }
        .card:nth-child(2) { animation-delay: .1s; }
        .card:nth-child(3) { animation-delay: .2s; }
        .card:nth-child(4) { animation-delay: .3s; }
        .card:nth-child(5) { animation-delay: .4s; }
        .card:nth-child(6) { animation-delay: .5s; }

        .daily-group { animation: fadeInUp .4s ease forwards; }
        .daily-group:nth-child(1) { animation-delay: 0s; }
        .daily-group:nth-child(2) { animation-delay: .1s; }
        .daily-group:nth-child(3) { animation-delay: .2s; }
        .daily-group:nth-child(4) { animation-delay: .3s; }
    </style>
<base target="_blank">
</head>
<body>

<header>
    <div class="logo">VALDI<span>SHOPPER</span></div>
    <div class="header-sub">Mejora Continua</div>
</header>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('proyectos')" id="tab-proyectos">
        📁 Proyectos <span class="tab-badge" id="tbadge-proyectos">6</span>
    </button>
    <button class="tab-btn" onclick="switchTab('diario')" id="tab-diario">
        🗓 Tareas Diarias <span class="tab-badge" id="tbadge-diario">—</span>
    </button>
</div>

<div class="stats-bar" id="stats-bar"></div>

<main>
    <div class="tab-panel active" id="panel-proyectos">
        <div class="section-header">
            <div>
                <div class="section-title">Seguimiento de Proyectos</div>
                <div class="section-sub">Mejora Continua · Agustin Williamson</div>
            </div>
        </div>
        <div class="cards-grid" id="dashboard"></div>
    </div>

    <div class="tab-panel" id="panel-diario">
        <div class="section-header">
            <div>
                <div class="section-title">Tareas Diarias</div>
                <div class="section-sub" id="daily-date-sub">Rutina operacional de Mejora Continua</div>
            </div>
        </div>
        <div class="daily-grid" id="daily-grid"></div>
        <button class="reset-day-btn" onclick="resetDay()">↺ Resetear día</button>
    </div>
</main>

<div id="toast">

<script>
/* ═══════════════════════════════════

   ═══════════════════════════════════ */
const proyectos = [

        desc_long:`Plataforma para que los departamentos (<strong>MC, CCO, Finanzas, Personas</strong>) suban sus scripts. La <strong>IA generativa</strong> crea un <code>.md</code> explicando el proyecto y analiza los procesos para <strong>identificar tareas rutinarias automatizables</strong> y oportunidades de mejora futura.`,
        tareas:[

        tareas:[

        desc_long:`App móvil complementaria a CCO-Hub. En <strong>fase de prueba cerrada</strong> con conductores. Pendiente la <strong>aprobación de las personas faltantes</strong> para publicar la versión definitiva y cerrar el ciclo del ecosistema CCO.`,
        tareas:[

            {t:'Prueba cerrada con conductores', done:true},
            {t:'Aprobación personas faltantes', done:false},

    },
    {
        id:'coordinadores', nombre:'Coordinadores Valdishopper', estado:'Reclutamiento', conexion:'Android · Play Store',
        desc_short:'App de Víctor publicada. En proceso de reclutamiento y elaboración de manual.',
        desc_long:`App móvil de <strong>Víctor</strong> para Coordinadores de Sala. El archivo <strong>AAB fue generado y publicado en Play Store</strong>. Actualmente en proceso de <strong>reclutamiento de usuarios</strong> (obtención de correos) y elaboración del <strong>manual de uso</strong> para cuando se entreguen los accesos correspondientes.`,
        tareas:[
            {t:'Generación y subida AAB a Play Store', done:true},
            {t:'Proceso de reclutamiento de usuarios', done:true},
            {t:'Obtención de correos coordinadores', done:true},
            {t:'Elaboración de manual de uso', done:true},
            {t:'Confirmación de reclutados y app instalada', done:false},
            {t:'Actualización de nuevas funciones o visuales (14 días)', done:false}
        ]
    }
];

/* ═══════════════════════════════════
   TAREAS DIARIAS
   ═══════════════════════════════════ */
const dailyGroups = [
    {
        id:'scrapers', name:'Revisión de Scrapers', icon:'🔍', iconBg:'#EFF6FF',
        meta:'Verificar funcionamiento y descarga correcta de información',
        tasks:[
            { id:'s1', name:'Revisar scrapers de ROTOR (proyecto Guillermo)', note:'Confirmar que estén corriendo y enviando información a los buckets GCP correspondientes.', freq:'diario' },
            { id:'s2', name:'Revisar scrapers autónomos — carga correcta', note:'Verificar que los datos subidos sean completos y sin errores de formato.', freq:'diario' },
            { id:'s3', name:'Comprobar buckets de almacenamiento GCP', note:'Cada scraper debe haber subido correctamente su archivo al bucket asignado.', freq:'diario' },
        ]
    },
    {
        id:'agenda', name:'Agenda y Proyectos', icon:'📋', iconBg:'#F5F3FF',
        meta:'Organización del día y avance en proyectos activos',
        tasks:[
            { id:'a1', name:'Organizar agenda del día con proyectos activos', note:'Priorizar según estado de proyectos y reuniones programadas.', freq:'diario' },
            { id:'a2', name:'Avance en proyectos: comentar y documentar código', note:'Incluye nuevas funcionalidades y mejoras sobre lo existente.', freq:'diario' },
            { id:'a3', name:'Revisión y modificación de scrapers existentes', note:'Ajustes según incidencias detectadas o mejoras planificadas.', freq:'diario' },
        ]
    },
    {
        id:'falabella', name:'Actualización Falabella → Power BI', icon:'📊', iconBg:'#FFF7ED',
        meta:'Carga manual (Víctor de vacaciones) · Solo Lunes o Martes',
        tasks:[
            { id:'f1', name:'Subir archivos Falabella actualizados al Power BI', note:'Carga manual para tener la data lista para la reunión del miércoles.', freq:'lu-ma' },
            { id:'f2', name:'Verificar datos cargados en el reporte', note:'Revisar tablas y visualizaciones antes de la reunión.', freq:'lu-ma' },
        ]
    },
    {
        id:'solicitudes', name:'Solicitudes y Apoyo Ad-hoc', icon:'🤝', iconBg:'#FFF0F7',
        meta:'Peticiones de otros equipos — surgen durante el día',
        tasks:[
            { id:'r1', name:'Atender solicitudes de otros equipos o personas', note:'Priorizar según urgencia. Pueden llegar en cualquier momento del día.', freq:'adhoc' },
            { id:'r2', name:'Registrar brevemente lo atendido', note:'Nota rápida de qué se ayudó y a quién, para trazabilidad.', freq:'adhoc' },
        ]
    }
];

const freqLabel = { 'diario':'Diario','lu-ma':'Lun · Mar','adhoc':'Ad-hoc','semanal':'Semanal' };
const estadoBadge = {
    'En Curso':'badge-encurso','Desarrollo':'badge-desarrollo','Planificación':'badge-planificacion',
    'Finalizado':'badge-finalizado','Pruebas':'badge-pruebas','Reclutamiento':'badge-reclutamiento'
};

/* ═══════════════════════════════════
   ESTADO DE TAREAS DIARIAS
   ═══════════════════════════════════ */
let dailyState = (()=>{
    const today = new Date().toDateString();
    try { const r = JSON.parse(sessionStorage.getItem('vs_daily')||'{}'); if(r.date===today) return r.tasks; } catch(e){}
    const s={};
    dailyGroups.forEach(g=>g.tasks.forEach(t=>s[t.id]=false));
    return s;
})();

function saveDS(){ 
    try{ 
        sessionStorage.setItem('vs_daily',JSON.stringify({date:new Date().toDateString(),tasks:dailyState})); 
    } catch(e){} 
}

const checkSVG = `<svg width="10" height="10" fill="none" viewBox="0 0 24 24"><path stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
const chevSVG  = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>`;

/* ═══════════════════════════════════
   RENDERIZAR PROYECTOS
   ═══════════════════════════════════ */
function renderDashboard(){
    document.getElementById('dashboard').innerHTML = proyectos.map(p=>{
        const total=p.tareas.length, comp=p.tareas.filter(t=>t.done).length, pct=total?Math.round(comp/total*100):0;
        return `
        <div class="card" id="card-${p.id}">
            <div class="card-header">
                <div class="card-title-row">
                    <div class="card-nombre">${p.nombre}</div>
                    <div class="card-desc-short">${p.desc_short}</div>
                </div>
                <span class="badge ${estadoBadge[p.estado]||'badge-encurso'}">${p.estado}</span>
            </div>
            <div class="card-body">
                <button class="expand-btn" id="btn-${p.id}" onclick="toggleDesc('${p.id}')">${chevSVG} Ver descripción</button>
                <div class="desc-detail" id="desc-${p.id}">${p.desc_long}</div>
                <div>
                    <div class="progress-meta">
                        <span class="progress-label">📊 Progreso</span>
                        <span class="progress-pct" id="pct-${p.id}">${pct}%</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill ${pct===100?'complete':''}" id="fill-${p.id}" style="width:${pct}%"></div></div>
                </div>
                <div class="tasks-list">
                    ${p.tareas.map((t,i)=>`
                    <div class="task-item" onclick="updateTask('${p.id}',${i})">
                        <div class="task-check ${t.done?'checked':''}" id="chk-${p.id}-${i}">${checkSVG}</div>
                        <span class="task-label ${t.done?'done':''}" id="lbl-${p.id}-${i}">${t.t}</span>
                    </div>`).join('')}
                </div>
            </div>
            <div class="card-footer">
                <span class="tasks-count" id="foot-${p.id}">✓ ${comp} de ${total} tareas</span>
                ${p.conexion?`<span class="conn-badge">${p.conexion}</span>`:''}
            </div>
        </div>`;
    }).join('');
    document.getElementById('tbadge-proyectos').textContent = proyectos.length;
}

function toggleDesc(id){
    const d=document.getElementById(`desc-${id}`), b=document.getElementById(`btn-${id}`);
    const o=d.classList.toggle('open');
    b.classList.toggle('open',o);
    b.innerHTML=`${chevSVG} ${o?'Ocultar descripción':'Ver descripción'}`;
}

function updateTask(projId,idx){
    const p=proyectos.find(x=>x.id===projId);
    p.tareas[idx].done=!p.tareas[idx].done;
    const done=p.tareas[idx].done;
    document.getElementById(`chk-${projId}-${idx}`).classList.toggle('checked',done);
    document.getElementById(`lbl-${projId}-${idx}`).classList.toggle('done',done);
    const total=p.tareas.length, comp=p.tareas.filter(t=>t.done).length, pct=Math.round(comp/total*100);
    const fill=document.getElementById(`fill-${projId}`);
    fill.style.width=pct+'%'; fill.classList.toggle('complete',pct===100);
    document.getElementById(`pct-${projId}`).textContent=pct+'%';
    document.getElementById(`foot-${projId}`).textContent=`✓ ${comp} de ${total} tareas`;
    renderStats(); showToast(done?'✓ Tarea completada':'↺ Tarea desmarcada');
}

/* ═══════════════════════════════════
   RENDERIZAR TAREAS DIARIAS
   ═══════════════════════════════════ */
function renderDaily(){
    const now=new Date();
    const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    document.getElementById('daily-date-sub').textContent=`${dias[now.getDay()]} ${now.getDate()} de ${meses[now.getMonth()]} · Rutina operacional`;

    document.getElementById('daily-grid').innerHTML = dailyGroups.map(g=>{
        const total=g.tasks.length, done=g.tasks.filter(t=>dailyState[t.id]).length, pct=Math.round(done/total*100);
        const pctColor = pct===100?'#15803D':'var(--vs-pink)';
        return `
        <div class="daily-group">
            <div class="daily-group-header" onclick="toggleGroup('${g.id}')" id="ghdr-${g.id}">
                <div class="group-icon" style="background:${g.iconBg}">${g.icon}</div>
                <div class="group-info">
                    <div class="group-name">${g.name}</div>
                    <div class="group-meta">${g.meta}</div>
                </div>
                <div class="group-right">
                    <div class="mini-track"><div class="mini-fill" id="mfill-${g.id}" style="width:${pct}%"></div></div>
                    <span class="group-pct" id="gpct-${g.id}" style="color:${pctColor}">${done}/${total}</span>
                    <svg class="group-chevron" id="gchev-${g.id}" width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="#8A94B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
                </div>
            </div>
            <div class="daily-tasks-body" id="gbody-${g.id}">
                ${g.tasks.map(t=>`
                <div class="daily-task-row" onclick="toggleDaily('${t.id}','${g.id}')">
                    <div class="task-check ${dailyState[t.id]?'checked':''}" id="dchk-${t.id}" style="margin-top:2px">${checkSVG}</div>
                    <div class="daily-task-content">
                        <div class="daily-task-name ${dailyState[t.id]?'done':''}" id="dlbl-${t.id}">${t.name}</div>
                        <div class="daily-task-note">${t.note}</div>
                    </div>
                    <span class="freq-tag freq-${t.freq}">${freqLabel[t.freq]}</span>
                </div>`).join('')}
            </div>
        </div>`;
    }).join('');
    updateDailyBadge();
}

function toggleGroup(id){
    document.getElementById(`gbody-${id}`).classList.toggle('open');
    document.getElementById(`gchev-${id}`).classList.toggle('open');
    document.getElementById(`ghdr-${id}`).classList.toggle('open');
}

function toggleDaily(taskId,groupId){
    dailyState[taskId]=!dailyState[taskId]; saveDS();
    const done=dailyState[taskId];
    document.getElementById(`dchk-${taskId}`).classList.toggle('checked',done);
    document.getElementById(`dlbl-${taskId}`).classList.toggle('done',done);
    const g=dailyGroups.find(x=>x.id===groupId);
    const total=g.tasks.length, doneC=g.tasks.filter(t=>dailyState[t.id]).length, pct=Math.round(doneC/total*100);
    document.getElementById(`mfill-${groupId}`).style.width=pct+'%';
    const gp=document.getElementById(`gpct-${groupId}`);
    gp.textContent=`${doneC}/${total}`; gp.style.color=pct===100?'#15803D':'var(--vs-pink)';
    updateDailyBadge(); renderStats(); showToast(done?'✓ Tarea completada':'↺ Desmarcada');
}

function updateDailyBadge(){
    const all=Object.values(dailyState), done=all.filter(Boolean).length;
    document.getElementById('tbadge-diario').textContent=`${done}/${all.length}`;
}

function resetDay(){
    Object.keys(dailyState).forEach(k=>dailyState[k]=false); saveDS();
    renderDaily(); renderStats(); showToast('↺ Día reseteado');
}

/* ═══════════════════════════════════
   BARRA DE ESTADÍSTICAS
   ═══════════════════════════════════ */
function renderStats(){
    const bar=document.getElementById('stats-bar');
    const activeTab=document.querySelector('.tab-btn.active').id.replace('tab-','');
    if(activeTab==='proyectos'){
        const counts={};
        proyectos.forEach(p=>counts[p.estado]=(counts[p.estado]||0)+1);
        const totalT=proyectos.reduce((a,p)=>a+p.tareas.length,0);
        const doneT=proyectos.reduce((a,p)=>a+p.tareas.filter(t=>t.done).length,0);
        const colors={'Finalizado':'#15803D','En Curso':'#1D4ED8','Desarrollo':'#C2410C','Pruebas':'#A02D6E','Planificación':'#6D28D9','Reclutamiento':'#854D0E'};
        let h=`<div class="stat-item"><span class="stat-icon" style="background:#EEF1F8">📁</span><span class="stat-label">Proyectos</span><span class="stat-val">${proyectos.length}</span></div><div class="stat-divider"></div>`;
        Object.entries(counts).filter(([,v])=>v>0).forEach(([k,v])=>{
            h+=`<div class="stat-item"><span class="stat-dot" style="background:${colors[k]||'#888'}"></span><span class="stat-label">${k}</span><span class="stat-val">${v}</span></div>`;
        });
        h+=`<div class="stat-divider" style="margin-left:auto"></div><div class="stat-item"><span class="stat-icon" style="background:#F0FDF4">✓</span><span class="stat-label">Tareas completadas</span><span class="stat-val">${doneT}/${totalT}</span></div>`;
        bar.innerHTML=h;
    } else {
        const all=Object.values(dailyState), done=all.filter(Boolean).length, pct=Math.round(done/all.length*100);
        const now=new Date();
        let h=`<div class="stat-item"><span class="stat-icon" style="background:#EFF6FF">📊</span><span class="stat-label">Progreso del día</span><span class="stat-val">${done}/${all.length} tareas</span></div>`;
        h+=`<div class="stat-divider"></div><div class="stat-item"><span class="stat-icon" style="background:${pct===100?'#F0FDF4':'#FBF0F7'}">${pct===100?'🎉':'📈'}</span><span class="stat-label">Completado</span><span class="stat-val" style="color:${pct===100?'#15803D':'var(--vs-pink)'}">${pct}%</span></div>`;
        h+=`<div class="stat-divider" style="margin-left:auto"></div><div class="stat-item"><span class="stat-icon" style="background:#F5F3FF">📅</span><span class="stat-label">Hoy</span><span class="stat-val">${now.toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'})}</span></div>`;
        bar.innerHTML=h;
    }
}

/* ═══════════════════════════════════
   TABS
   ═══════════════════════════════════ */
function switchTab(tab){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    document.getElementById(`panel-${tab}`).classList.add('active');
    renderStats();
}

/* ═══════════════════════════════════
   TOAST NOTIFICATIONS
   ═══════════════════════════════════ */
function showToast(msg){
    const t=document.getElementById('toast');
    document.getElementById('toast-msg').textContent=msg;
    t.style.display='flex';
    clearTimeout(window._tt);
    window._tt=setTimeout(()=>t.style.display='none',2500);
}

/* ═══════════════════════════════════
   INICIALIZACIÓN
   ═══════════════════════════════════ */
renderDashboard();
renderDaily();
renderStats();
</script>
