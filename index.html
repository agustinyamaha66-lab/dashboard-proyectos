        .subtask-check.checked { background: #1B8A5A; border-color: #1B8A5A; }

        .subtask-check.checked svg { display: block; }
        .subtask-label { font-size: .68rem; color: #6B7698; font-weight: 500; flex: 1; }
        .subtask-label.done { text-decoration: line-through; color: #A8B0C8; }
        .card-footer { padding: .75rem 1.25rem; border-top: 1px solid #F0F2F8; display: flex; align-items: center; justify-content: space-between; }

        .group-right { display: flex; align-items: center; gap: .6rem; flex-shrink: 0; }
        .group-pct { font-size: .75rem; font-weight: 800; min-width: 30px; text-align: right; }

        .group-chevron { transition: transform .3s; color: #8A94B8; }
        .group-chevron.open { transform: rotate(180deg); }
        .daily-tasks-body { padding: .5rem .75rem .75rem; display: none; }
        .daily-tasks-body.open { display: block; }
        .daily-task-row { display: flex; align-items: flex-start; gap: .65rem; padding: .55rem .5rem; border-radius: 8px; cursor: pointer; transition: background .15s; }
        .daily-task-row:hover { background: #F5F6FA; }
        .daily-task-content { flex: 1; min-width: 0; }
        .daily-task-name { font-size: .75rem; font-weight: 600; color: #2A3558; line-height: 1.4; }
        .daily-task-name.done { text-decoration: line-through; color: #A8B0C8; }
        .daily-task-note { font-size: .67rem; color: #8A94B8; font-weight: 500; margin-top: .15rem; line-height: 1.5; }
        .freq-tag { font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: .15rem .45rem; border-radius: 5px; white-space: nowrap; flex-shrink: 0; margin-top: .15rem; }
        .freq-diario { background:#EFF6FF; color:#1D4ED8; }
        .freq-lu-ma { background:#FFF7ED; color:#C2410C; }
        .freq-adhoc { background:#F5F3FF; color:#6D28D9; }
        .freq-semanal { background:#F0FDF4; color:#15803D; }
        .reset-day-btn { margin-top: 1.5rem; padding: .5rem 1rem; font-size: .65rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; border-radius: 8px; cursor: pointer; background: #F0F2F8; color: #6B7698; border: none; transition: all .15s; }
        .reset-day-btn:hover { background: #FBF0F7; color: #A02D6E; }
        #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #0B1C49; color: white; font-size: .72rem; font-weight: 600; padding: .75rem 1rem; border-radius: 10px; border-left: 3px solid #1B8A5A; box-shadow: 0 8px 24px rgba(11,28,73,.25); display: none; align-items: center; gap: .5rem; z-index: 200; }
        @media(max-width:640px){ .nav-tabs { padding: 0 1rem; overflow-x: auto; } .tab-btn { padding: .75rem .9rem; font-size: .65rem; } main { padding: 1.25rem 1rem 4rem; } .cards-grid { grid-template-columns: 1fr; } .stats-bar { padding: .75rem 1rem; gap: 1rem; } .group-meta { display: none; } }
    </style>

        {id:'f2', name:'Verificar datos cargados en el reporte', note:'Revisar tablas y visualizaciones antes de la reunion.', freq:'lu-ma'},
    ]},
    {id:'solicitudes', name:'Solicitudes y Apoyo Ad-hoc', icon:'&#129309;', iconBg:'#FFF0F7', meta:'Peticiones de otros equipos -- surgen durante el dia', tasks:[
        {id:'r1', name:'Atender solicitudes de otros equipos o personas', note:'Priorizar segun urgencia. Pueden llegar en cualquier momento del dia.', freq:'adhoc'},
        {id:'r2', name:'Registrar brevemente lo atendido', note:'Nota rapida de que se ayudo y a quien, para trazabilidad.', freq:'adhoc'},
    ]}
];

const freqLabel = {'diario':'Diario','lu-ma':'Lun Mar','adhoc':'Ad-hoc','semanal':'Semanal'};
const estadoBadge = {'En Curso':'badge-encurso','Desarrollo':'badge-desarrollo','Planificacion':'badge-planificacion','Finalizado':'badge-finalizado','Pruebas':'badge-pruebas','Reclutamiento':'badge-reclutamiento'};

let dailyState = (function(){
    var today = new Date().toDateString();
    try { var r = JSON.parse(sessionStorage.getItem('vs_daily')||'{}'); if(r.date===today) return r.tasks; } catch(e){}
    var s={};
    dailyGroups.forEach(function(g){g.tasks.forEach(function(t){s[t.id]=false;});});
    return s;
})();
function saveDS(){ try{ sessionStorage.setItem('vs_daily',JSON.stringify({date:new Date().toDateString(),tasks:dailyState})); }catch(e){} }

var checkSVG = '<svg width="10" height="10" fill="none" viewBox="0 0 24 24"><path stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
var checkSVGsm = '<svg width="8" height="8" fill="none" viewBox="0 0 24 24"><path stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
var chevSVG = '<svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>';
var chevSVGsm = '<svg width="11" height="11" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>';

function renderCards(dataArray, containerId, badgeId){
    document.getElementById(containerId).innerHTML = dataArray.map(function(p){
        var total=p.tareas.length, comp=p.tareas.filter(function(t){return t.done;}).length, pct=total?Math.round(comp/total*100):0;
        var tareasHtml = p.tareas.map(function(t,i){
            var hasSub = t.subtareas && t.subtareas.length > 0;
            var subComp = hasSub ? t.subtareas.filter(function(s){return s.done;}).length : 0;
            var subTotal = hasSub ? t.subtareas.length : 0;
            var rowHtml = '<div class="task-item" onclick="updateTask(&#39;'+p.id+'&#39;,'+i+', &#39;'+containerId+'&#39;)">'
                + '<div class="task-check '+(t.done?'checked':'')+'" id="chk-'+p.id+'-'+i+'">'+checkSVG+'</div>'
                + '<span class="task-label '+(t.done?'done':'')+'" id="lbl-'+p.id+'-'+i+'">'+t.t+'</span>';
            if(hasSub){
                rowHtml += '<span class="subtask-count" id="subcnt-'+p.id+'-'+i+'">'+subComp+'/'+subTotal+'</span>'
                    + '<button class="subtask-toggle" id="stoggle-'+p.id+'-'+i+'" onclick="event.stopPropagation();toggleSubtasks(&#39;'+p.id+'&#39;,'+i+')" title="Ver subtareas">'+chevSVGsm+'</button>';
            }
            rowHtml += '</div>';
            if(hasSub){
                rowHtml += '<div class="subtasks-container" id="subs-'+p.id+'-'+i+'">'
                    + t.subtareas.map(function(s,j){
                        return '<div class="subtask-item" onclick="updateSubtask(&#39;'+p.id+'&#39;,'+i+','+j+', &#39;'+containerId+'&#39;)">'
                            + '<div class="subtask-check '+(s.done?'checked':'')+'" id="schk-'+p.id+'-'+i+'-'+j+'">'+checkSVGsm+'</div>'
                            + '<span class="subtask-label '+(s.done?'done':'')+'" id="slbl-'+p.id+'-'+i+'-'+j+'">'+s.t+'</span>'
                            + '</div>';
                    }).join('')
                    + '</div>';
            }
            return '<div>'+rowHtml+'</div>';
        }).join('');
        return '<div class="card" id="card-'+p.id+'">'
            + '<div class="card-header"><div class="card-title-row"><div class="card-nombre">'+p.nombre+'</div><div class="card-desc-short">'+p.desc_short+'</div></div>'
            + '<span class="badge '+(estadoBadge[p.estado]||'badge-encurso')+'">'+p.estado+'</span></div>'
            + '<div class="card-body">'
            + '<button class="expand-btn" id="btn-'+p.id+'" onclick="toggleDesc(&#39;'+p.id+'&#39;)">'+chevSVG+' Ver descripcion</button>'
            + '<div class="desc-detail" id="desc-'+p.id+'">'+p.desc_long+'</div>'
            + '<div><div class="progress-meta"><span class="progress-label">Progreso</span><span class="progress-pct" id="pct-'+p.id+'">'+pct+'%</span></div>'
            + '<div class="progress-track"><div class="progress-fill '+(pct===100?'complete':'')+'" id="fill-'+p.id+'" style="width:'+pct+'%"></div></div></div>'
            + '<div class="tasks-list">'+tareasHtml+'</div>'
            + '</div>'
            + '<div class="card-footer"><span class="tasks-count" id="foot-'+p.id+'">'+comp+' de '+total+' tareas</span>'
            + (p.conexion?'<span class="conn-badge">'+p.conexion+'</span>':'')+'</div>'
            + '</div>';
    }).join('');
    if(badgeId) document.getElementById(badgeId).textContent = dataArray.length;
}

function renderDashboard(){
    renderCards(proyectos, 'dashboard-proyectos', 'tbadge-proyectos');
    renderCards(scripts, 'dashboard-scripts', 'tbadge-scripts');
}

function toggleSubtasks(projId, idx){
    var container = document.getElementById('subs-'+projId+'-'+idx);
    var btn = document.getElementById('stoggle-'+projId+'-'+idx);
    var isOpen = container.classList.toggle('open');
    btn.classList.toggle('open', isOpen);
}

function toggleDesc(id){
    var d=document.getElementById('desc-'+id), b=document.getElementById('btn-'+id);
    var o=d.classList.toggle('open');
    b.classList.toggle('open',o);
    b.innerHTML=chevSVG+' '+(o?'Ocultar descripcion':'Ver descripcion');
}

function findProject(projId){
    var p = proyectos.find(function(x){return x.id===projId;});
    if(p) return {project: p, array: proyectos};
    p = scripts.find(function(x){return x.id===projId;});
    if(p) return {project: p, array: scripts};
    return null;
}

function updateTask(projId, idx, containerId){
    var found = findProject(projId);
    if(!found) return;
    var p = found.project;
    p.tareas[idx].done = !p.tareas[idx].done;
    var done = p.tareas[idx].done;
    document.getElementById('chk-'+projId+'-'+idx).classList.toggle('checked', done);
    document.getElementById('lbl-'+projId+'-'+idx).classList.toggle('done', done);
    var total=p.tareas.length, comp=p.tareas.filter(function(t){return t.done;}).length, pct=Math.round(comp/total*100);
    var fill=document.getElementById('fill-'+projId);
    fill.style.width=pct+'%'; fill.classList.toggle('complete',pct===100);
    document.getElementById('pct-'+projId).textContent=pct+'%';
    document.getElementById('foot-'+projId).textContent=comp+' de '+total+' tareas';
    renderStats(); showToast(done?'Tarea completada':'Tarea desmarcada');
}

function updateSubtask(projId, tareaIdx, subIdx, containerId){
    var found = findProject(projId);
    if(!found) return;
    var p = found.project;
    var sub = p.tareas[tareaIdx].subtareas[subIdx];
    sub.done = !sub.done;
    document.getElementById('schk-'+projId+'-'+tareaIdx+'-'+subIdx).classList.toggle('checked', sub.done);
    document.getElementById('slbl-'+projId+'-'+tareaIdx+'-'+subIdx).classList.toggle('done', sub.done);
    var subs = p.tareas[tareaIdx].subtareas;
    var subComp = subs.filter(function(s){return s.done;}).length;
    var cntEl = document.getElementById('subcnt-'+projId+'-'+tareaIdx);
    if(cntEl) cntEl.textContent = subComp+'/'+subs.length;
    showToast(sub.done?'Subtarea completada':'Subtarea desmarcada');
}

function renderDaily(){
    var now=new Date();
    var dias=['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
    var meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    document.getElementById('daily-date-sub').textContent=dias[now.getDay()]+' '+now.getDate()+' de '+meses[now.getMonth()]+' - Rutina operacional';
    document.getElementById('daily-grid').innerHTML = dailyGroups.map(function(g){
        var total=g.tasks.length, done=g.tasks.filter(function(t){return dailyState[t.id];}).length, pct=Math.round(done/total*100);
        var pctColor=pct===100?'#15803D':'#D64294';
        return '<div class="daily-group">'
            + '<div class="daily-group-header" onclick="toggleGroup(&#39;'+g.id+'&#39;)" id="ghdr-'+g.id+'">'
            + '<div class="group-icon" style="background:'+g.iconBg+'">'+g.icon+'</div>'
            + '<div class="group-info"><div class="group-name">'+g.name+'</div><div class="group-meta">'+g.meta+'</div></div>'
            + '<div class="group-right"><div class="mini-track"><div class="mini-fill" id="mfill-'+g.id+'" style="width:'+pct+'%"></div></div>'
            + '<span class="group-pct" id="gpct-'+g.id+'" style="color:'+pctColor+'">'+done+'/'+total+'</span>'
            + '<svg class="group-chevron" id="gchev-'+g.id+'" width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="#8A94B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>'
            + '</div></div>'
            + '<div class="daily-tasks-body" id="gbody-'+g.id+'">'
            + g.tasks.map(function(t){
                return '<div class="daily-task-row" onclick="toggleDaily(&#39;'+t.id+'&#39;,&#39;'+g.id+'&#39;)">'
                    + '<div class="task-check '+(dailyState[t.id]?'checked':'')+'" id="dchk-'+t.id+'" style="margin-top:2px">'+checkSVG+'</div>'
                    + '<div class="daily-task-content"><div class="daily-task-name '+(dailyState[t.id]?'done':'')+'" id="dlbl-'+t.id+'">'+t.name+'</div>'
                    + '<div class="daily-task-note">'+t.note+'</div></div>'
                    + '<span class="freq-tag freq-'+t.freq+'">'+freqLabel[t.freq]+'</span></div>';
            }).join('')
            + '</div></div>';
    }).join('');
    updateDailyBadge();
}

function toggleGroup(id){
    document.getElementById('gbody-'+id).classList.toggle('open');
    document.getElementById('gchev-'+id).classList.toggle('open');
    document.getElementById('ghdr-'+id).classList.toggle('open');
}

function toggleDaily(taskId,groupId){
    dailyState[taskId]=!dailyState[taskId]; saveDS();
    var done=dailyState[taskId];
    document.getElementById('dchk-'+taskId).classList.toggle('checked',done);
    document.getElementById('dlbl-'+taskId).classList.toggle('done',done);
    var g=dailyGroups.find(function(x){return x.id===groupId;});
    var total=g.tasks.length, doneC=g.tasks.filter(function(t){return dailyState[t.id];}).length, pct=Math.round(doneC/total*100);
    document.getElementById('mfill-'+groupId).style.width=pct+'%';
    var gp=document.getElementById('gpct-'+groupId);
    gp.textContent=doneC+'/'+total; gp.style.color=pct===100?'#15803D':'#D64294';
    updateDailyBadge(); renderStats(); showToast(done?'Tarea completada':'Desmarcada');
}

function updateDailyBadge(){
    var all=Object.values(dailyState), done=all.filter(Boolean).length;
    document.getElementById('tbadge-diario').textContent=done+'/'+all.length;
}

function resetDay(){
    Object.keys(dailyState).forEach(function(k){dailyState[k]=false;}); saveDS();
    renderDaily(); renderStats(); showToast('Dia reseteado');
}

function renderStats(){
    var bar=document.getElementById('stats-bar');
    var activeTab=document.querySelector('.tab-btn.active').id.replace('tab-','');
    if(activeTab==='proyectos'){
        var counts={};
        proyectos.forEach(function(p){counts[p.estado]=(counts[p.estado]||0)+1;});
        var totalT=proyectos.reduce(function(a,p){return a+p.tareas.length;},0);
        var doneT=proyectos.reduce(function(a,p){return a+p.tareas.filter(function(t){return t.done;}).length;},0);
        var colors={'Finalizado':'#15803D','En Curso':'#1D4ED8','Desarrollo':'#C2410C','Pruebas':'#A02D6E','Planificacion':'#6D28D9','Reclutamiento':'#854D0E'};
        var h='<div class="stat-item"><span class="stat-label">Proyectos</span><span class="stat-val">'+proyectos.length+'</span></div><div class="stat-divider"></div>';
        Object.entries(counts).filter(function(e){return e[1]>0;}).forEach(function(e){
            h+='<div class="stat-item"><span class="stat-label" style="color:'+(colors[e[0]]||'#888')+'">'+e[0]+'</span><span class="stat-val">'+e[1]+'</span></div>';
        });
        h+='<div class="stat-divider" style="margin-left:auto"></div><div class="stat-item"><span class="stat-label">Tareas completadas</span><span class="stat-val">'+doneT+'/'+totalT+'</span></div>';
        bar.innerHTML=h;
    } else if(activeTab==='scripts'){
        var counts={};
        scripts.forEach(function(p){counts[p.estado]=(counts[p.estado]||0)+1;});
        var totalT=scripts.reduce(function(a,p){return a+p.tareas.length;},0);
        var doneT=scripts.reduce(function(a,p){return a+p.tareas.filter(function(t){return t.done;}).length;},0);
        var colors={'Finalizado':'#15803D','En Curso':'#1D4ED8','Desarrollo':'#C2410C','Pruebas':'#A02D6E','Planificacion':'#6D28D9','Reclutamiento':'#854D0E'};
        var h='<div class="stat-item"><span class="stat-label">Scripts</span><span class="stat-val">'+scripts.length+'</span></div><div class="stat-divider"></div>';
        Object.entries(counts).filter(function(e){return e[1]>0;}).forEach(function(e){
            h+='<div class="stat-item"><span class="stat-label" style="color:'+(colors[e[0]]||'#888')+'">'+e[0]+'</span><span class="stat-val">'+e[1]+'</span></div>';
        });
        h+='<div class="stat-divider" style="margin-left:auto"></div><div class="stat-item"><span class="stat-label">Tareas completadas</span><span class="stat-val">'+doneT+'/'+totalT+'</span></div>';
        bar.innerHTML=h;
    } else {
        var all=Object.values(dailyState), done=all.filter(Boolean).length, pct=Math.round(done/all.length*100);
        var now=new Date();
        var h='<div class="stat-item"><span class="stat-label">Progreso del dia</span><span class="stat-val">'+done+'/'+all.length+' tareas</span></div>';
        h+='<div class="stat-divider"></div><div class="stat-item"><span class="stat-label">Completado</span><span class="stat-val" style="color:'+(pct===100?'#15803D':'#D64294')+'">'+pct+'%</span></div>';
        h+='<div class="stat-divider" style="margin-left:auto"></div><div class="stat-item"><span class="stat-label">Hoy</span><span class="stat-val">'+now.toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'})+'</span></div>';
        bar.innerHTML=h;
    }
}

function switchTab(tab){
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
    document.getElementById('tab-'+tab).classList.add('active');
    document.getElementById('panel-'+tab).classList.add('active');
    renderStats();
}

function showToast(msg){
    var t=document.getElementById('toast');
    document.getElementById('toast-msg').textContent=msg;
    t.style.display='flex';
    clearTimeout(window._tt);
    window._tt=setTimeout(function(){t.style.display='none';},2200);
}

renderDashboard();
renderDaily();
renderStats();
</script>
</body>
</html>
